name: Publish installable gateway release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and validate
        run: |
          python -m pip install -r requirements.txt
          python scripts/decision_client.py validate tests/fixtures/valid_request.json
          python -m unittest discover -s tests -v
          python tests/test_install_smoke.py
          python scripts/check_public_boundary.py .
          python scripts/build_release_manifest.py . --check
      - name: Package signed gateway
        shell: bash
        run: |
          mkdir -p dist/amazon-product-decision-gateway
          git archive --format=tar "${GITHUB_SHA}" | tar -x -C dist/amazon-product-decision-gateway
          find dist -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist -type f -name '*.pyc' -delete
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("dist/amazon-product-decision-gateway")
          manifest = (root / "PUBLIC_MANIFEST.sha256").read_text(encoding="utf-8")
          payload = json.loads((root / "RELEASE_PROVENANCE.json").read_text(encoding="utf-8"))
          assert hashlib.sha256(manifest.encode()).hexdigest() == payload["manifest_sha256"]
          for line in manifest.splitlines():
              digest, relative = line.split("  ", 1)
              assert hashlib.sha256((root / relative).read_bytes()).hexdigest() == digest, relative
          PY
          cd dist
          zip -r amazon-product-decision-suite.zip amazon-product-decision-gateway
          sha256sum amazon-product-decision-suite.zip > amazon-product-decision-suite.zip.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/amazon-product-decision-suite.zip
          dist/amazon-product-decision-suite.zip.sha256
          --repo "${{ github.repository }}"
          --title "Amazon Product Decision Gateway ${{ github.ref_name }}"
          --generate-notes
